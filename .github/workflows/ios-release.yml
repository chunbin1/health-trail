name: iOS Release

# Builds HealthTrailCore.xcframework + HealthTrail.ipa and uploads to App Store
# Connect / TestFlight. Decoupled from desktop release.yml so desktop releases
# are never blocked by iOS signing or App Store Connect availability.
#
# Secrets (see RELEASING.md):
#   IOS_DIST_P12           Apple Distribution certificate (.p12), base64-encoded
#   IOS_DIST_P12_PASSWORD  Password for IOS_DIST_P12
#   IOS_ASC_KEY            App Store Connect API key (.p8 contents, App Manager role)
#   IOS_ASC_KEY_ID         Key ID for IOS_ASC_KEY
#   IOS_ASC_ISSUER_ID      Issuer ID for IOS_ASC_KEY
#   (Falls back to NOTARY_KEY / NOTARY_KEY_ID / NOTARY_ISSUER_ID if IOS_ASC_* are unset.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.0; leave empty to derive from git tag / 1.0.0)'
        required: false
        type: string
      upload:
        description: 'Upload .ipa to App Store Connect / TestFlight'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'ios-v*'
      - 'v*'

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios-release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check iOS signing configuration
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_UPLOAD: ${{ inputs.upload }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_KEY: ${{ secrets.IOS_ASC_KEY || secrets.NOTARY_KEY }}
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID || secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID || secrets.NOTARY_ISSUER_ID }}
        run: |
          UPLOAD="true"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_UPLOAD" == "false" ]]; then
            UPLOAD="false"
          fi
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"

          HAS_SIGNING="true"
          if [[ -z "$IOS_DIST_P12" || -z "$IOS_DIST_P12_PASSWORD" || -z "$ASC_KEY" || -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" ]]; then
            HAS_SIGNING="false"
          fi
          echo "has_signing=$HAS_SIGNING" >> "$GITHUB_OUTPUT"

          if [[ "$HAS_SIGNING" != "true" ]]; then
            if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == v* ]]; then
              echo "::notice::IOS_DIST_P12 或 App Store Connect API Key 尚未配置，跳过 iOS App Store 发布（桌面版 release.yml 不受影响）。"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$UPLOAD" == "true" ]]; then
              echo "::error::缺少 iOS 签名或 App Store Connect 密钥：请配置 IOS_DIST_P12、IOS_DIST_P12_PASSWORD 以及 IOS_ASC_KEY/IOS_ASC_KEY_ID/IOS_ASC_ISSUER_ID（或复用 NOTARY_KEY*），详见 RELEASING.md。"
              exit 1
            fi
            echo "::notice::干跑模式（upload=false）且未配置签名证书，将执行无签名 Release archive 校验。"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.config.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        if: steps.config.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compute iOS version and build number
        if: steps.config.outputs.skip != 'true'
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          RAW="$INPUT_VERSION"
          if [[ -z "$RAW" && "$REF_NAME" == ios-v* ]]; then
            RAW="${REF_NAME#ios-v}"
          elif [[ -z "$RAW" && "$REF_NAME" == v* ]]; then
            RAW="${REF_NAME#v}"
          fi
          # CFBundleShortVersionString must be numeric (X.Y.Z); strip any -prerelease suffix.
          RAW="${RAW%%-*}"
          if [[ ! "$RAW" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            RAW="1.0.0"
          fi
          echo "marketing_version=$RAW" >> "$GITHUB_OUTPUT"
          echo "build_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "MARKETING_VERSION=$RAW CURRENT_PROJECT_VERSION=$RUN_NUMBER"

      - name: Build UI and run tests
        if: steps.config.outputs.skip != 'true'
        run: |
          make ui
          make test

      - name: Install gomobile and build HealthTrailCore.xcframework
        if: steps.config.outputs.skip != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          ./scripts/build_ios_core.sh

      - name: Unsigned dry-run archive (no signing secrets)
        if: steps.config.outputs.skip != 'true' && steps.config.outputs.has_signing != 'true'
        run: |
          xcodebuild \
            -project ios/HealthTrail.xcodeproj \
            -scheme HealthTrail \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/HealthTrail.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build_number }}"

      - name: Set up temporary signing keychain and ASC API key
        if: steps.config.outputs.skip != 'true' && steps.config.outputs.has_signing == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_KEY: ${{ secrets.IOS_ASC_KEY || secrets.NOTARY_KEY }}
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID || secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID || secrets.NOTARY_ISSUER_ID }}
        run: |
          KC="$RUNNER_TEMP/ios-signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/ios-dist.p12"
          security import "$RUNNER_TEMP/ios-dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/ios-dist.p12"
          curl -sSfL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -sSfL -o "$RUNNER_TEMP/AppleWWDRCAG4.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KC"
          security import "$RUNNER_TEMP/AppleWWDRCAG4.cer" -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" || {
            echo "::error::IOS_DIST_P12 中没有找到 Apple Distribution 签名证书。"
            exit 1
          }

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Archive and export HealthTrail.ipa
        if: steps.config.outputs.skip != 'true' && steps.config.outputs.has_signing == 'true'
        run: |
          xcodebuild -version
          # Archive unsigned so Xcode does not require an iOS App Development
          # provisioning profile (which fails when no test devices are registered).
          # -exportArchive below signs the .ipa with Apple Distribution + an
          # auto-fetched App Store Distribution profile (no devices required).
          xcodebuild \
            -project ios/HealthTrail.xcodeproj \
            -scheme HealthTrail \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/HealthTrail.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build_number }}"

          xcodebuild \
            -exportArchive \
            -archivePath ios/build/HealthTrail.xcarchive \
            -exportPath ios/build/export \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ls -la ios/build/export/

      - name: Upload .ipa artifact
        if: steps.config.outputs.skip != 'true' && steps.config.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-ios-${{ steps.ver.outputs.marketing_version }}-${{ steps.ver.outputs.build_number }}
          path: ios/build/export/*.ipa
          retention-days: 14

      - name: Upload .ipa to App Store Connect / TestFlight
        if: steps.config.outputs.skip != 'true' && steps.config.outputs.has_signing == 'true' && steps.config.outputs.upload == 'true'
        run: |
          IPA="$(find ios/build/export -maxdepth 1 -name '*.ipa' | head -n 1)"
          test -n "$IPA" || { echo "::error::未找到导出的 .ipa 文件"; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            -f "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up temporary keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ios-dist.p12" "$RUNNER_TEMP/AppleWWDRCAG3.cer" "$RUNNER_TEMP/AppleWWDRCAG4.cer"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8
