name: Release

# A tag like v1.0.0: first, the tagged commit came into main through a PR
# whose AI review says 可以合 (a test tag like v1.0.0-test.1 may instead be the
# latest commit of an open PR, reviewed the same way); then the same checks as
# CI, then a Developer ID signed, notarized universal dmg published as a GitHub
# Release, with the zip of the app that the app's own update downloads
# (HealthTrail-<version>.zip). The same release also gets the Windows zip,
# HealthTrail-<version>-windows.zip (health-trail.exe without a certificate,
# and version.txt), and its .sig, which the Windows app's own update checks.
# Mac and Windows build in parallel; a Windows failure doesn't hold back the
# Mac release, it goes out without the Windows files.
#
# Secrets (set once with `gh secret set`; how to make each is in RELEASING.md):
#   DEVELOPER_ID_P12           the Developer ID Application certificate and its
#                              private key, exported from Keychain Access, base64
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting it
#   NOTARY_KEY                 an App Store Connect API key (.p8 file contents)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID  that key's ids
#   UPDATE_SIGNING_KEY         the Ed25519 key the Windows zip is signed with
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release

jobs:
  ai-review:
    name: AI 审阅
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to tell whether the tag is on main
      - name: The tagged commit was reviewed and said 可以合
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            python3 -I scripts/ai_review_gate.py prerelease "$GITHUB_SHA"
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "没通过：$GITHUB_REF_NAME 指向的提交不在 main 上，不能发布。"; exit 1; }
            python3 -I scripts/ai_review_gate.py commit "$GITHUB_SHA"
          fi

  windows:
    needs: ai-review
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/windows
        with:
          version: ${{ github.ref_name }}
          release: 'true'
          signing-key: ${{ secrets.UPDATE_SIGNING_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-windows-zip
          path: |
            dist/HealthTrail-*-windows.zip
            dist/HealthTrail-*-windows.zip.sig

  macos:
    needs: ai-review
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe gives the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make ui
      - run: make test

      # a keychain of its own for this run, deleted at the end
      - name: Signing keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # make dmg signs with this identity; its name is the certificate's
          DEV_ID="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$DEV_ID" || { echo "no Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          echo "DEV_ID=$DEV_ID" >> "$GITHUB_ENV"

      - name: Signed, notarized dmg and update zip
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          make notarize NOTARY_AUTH="--key $RUNNER_TEMP/notary.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"
      - name: Both architectures in the binary
        run: lipo "dist/root/健康足迹.app/Contents/MacOS/health-trail" -verify_arch arm64 x86_64
      - name: MCP end to end
        run: python3 -I scripts/mcp_smoke.py "dist/root/健康足迹.app/Contents/MacOS/health-trail"

      - uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-mac
          path: |
            dist/*.dmg
            dist/HealthTrail-*.zip

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"

  publish:
    # the Mac build is required; the Windows one only when it made it
    needs: [macos, windows]
    if: ${{ !cancelled() && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: HealthTrail-mac
          path: dist
      - if: ${{ needs.windows.result == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: HealthTrail-windows-zip
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS: ${{ needs.windows.result }}
        # the notes are the annotated tag's message (git tag -a v1.1.0 -m "…");
        # fetched again because checkout may leave a plain tag in its place.
        # A tag with a hyphen (v1.1.0-test.1) is a pre-release.
        run: |
          [[ "$WINDOWS" == success ]] || echo "::warning::Windows 没打包成功，这次只发 Mac 版"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag \
            --title "健康足迹 ${GITHUB_REF_NAME#v}" $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
