name: CI

# Every push: the tests on macOS and on Windows, in parallel. macOS also
# builds an ad-hoc signed universal dmg (the same steps as a release, without
# the Developer ID certificate) and runs MCP end to end on the binary inside
# it. Windows builds an unsigned exe and runs the same MCP check on it.
# Both artifacts are kept for a week to download. Signing the exe comes later.
on:
  push:
    branches: ['**'] # a tag runs release.yml instead
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe gives the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # the Go code embeds frontend/dist, so the UI is built before vet
      - run: make ui
      - run: make test
      - run: make dmg DEV_ID=-
      - name: Both architectures in the binary
        run: lipo "dist/root/健康足迹.app/Contents/MacOS/health-trail" -verify_arch arm64 x86_64
      - name: MCP end to end
        run: python3 -I scripts/mcp_smoke.py "dist/root/健康足迹.app/Contents/MacOS/health-trail"

      - uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-dmg
          path: dist/*.dmg
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe gives the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: UI
        shell: bash
        working-directory: frontend
        run: npm ci && npm run build
      - name: Test
        shell: bash
        run: |
          go vet ./...
          go test ./...
          python -I scripts/test_ai_review_gate.py
          (cd frontend && npx tsc -b)
      - name: Build
        shell: bash
        run: |
          version=$(git describe --tags --always | sed 's/^v//')
          go build -ldflags "-s -w -H windowsgui -X main.version=${version}" -o health-trail.exe .
      - name: MCP end to end
        shell: bash
        run: python -I scripts/mcp_smoke.py "$PWD/health-trail.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-windows
          path: health-trail.exe
          retention-days: 7
