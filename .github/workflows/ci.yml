name: CI

# Every push: the tests on macOS and on Windows, in parallel. macOS also
# builds an ad-hoc signed universal dmg (the same steps as a release, without
# the Developer ID certificate) and runs MCP end to end on the binary inside
# it. Windows runs the same steps as a release (.github/actions/windows):
# an exe without a certificate, the MCP check on it, and its zip. Both are
# kept for a week to download; neither updates itself.
on:
  push:
    branches: ['**'] # a tag runs release.yml instead
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe gives the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # the Go code embeds frontend/dist, so the UI is built before vet
      - run: make ui
      - run: make test
      - run: make dmg DEV_ID=-
      - name: Both architectures in the binary
        run: lipo "dist/root/健康足迹.app/Contents/MacOS/health-trail" -verify_arch arm64 x86_64
      - name: MCP end to end
        run: python3 -I scripts/mcp_smoke.py "dist/root/健康足迹.app/Contents/MacOS/health-trail"

      - uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-dmg
          path: dist/*.dmg
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe gives the version
      - id: version
        shell: bash
        run: echo "v=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      # the same steps as a release, without the signing key: this exe and
      # zip don't update themselves
      - uses: ./.github/actions/windows
        with:
          version: ${{ steps.version.outputs.v }}
      - uses: actions/upload-artifact@v7
        with:
          name: HealthTrail-windows
          path: dist/HealthTrail-*-windows.zip
          retention-days: 7
